name: Update AsphaltWolves VTC Data

on:
  # Manuell startbar
  workflow_dispatch:

  # Alle 15 Minuten
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-vtc:
    name: Update TruckersMP VTC data
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # Repository auschecken
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Python installieren
      # ---------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------
      # VTC-Daten abrufen
      # ---------------------------------------------------
      - name: Fetch TruckersMP data
        env:
          VTC_ID: "92769"
        run: |
          python scripts/update_vtc.py

      # ---------------------------------------------------
      # Prüfen, ob sich etwas geändert hat
      # ---------------------------------------------------
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------
      # Neue Daten speichern
      # ---------------------------------------------------
      - name: Commit updated VTC data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "AsphaltWolves Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/vtc.json

          git commit \
            -m "Update AsphaltWolves VTC data"

          git push
